name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build release APK
        run: gradle assembleRelease --stacktrace
      - name: Prepare release files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/pods-companion.apk
          ls -la out
          python3 -c "import json,os,subprocess; n=int(os.environ['GITHUB_RUN_NUMBER']); msg=subprocess.check_output(['git','log','-1','--pretty=%s']).decode().strip()[:200]; json.dump({'versionCode':n,'versionName':'0.2.%d'%n,'notes':msg}, open('out/version.json','w'), ensure_ascii=False)"
          cat out/version.json
      - uses: actions/upload-artifact@v4
        with:
          name: PodsCompanion-apk
          path: out/pods-companion.apk
      - name: Publish to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: false
          make_latest: true
          files: |
            out/pods-companion.apk
            out/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
